services:
  flight-tracking:
    image: ghcr.io/turentoo/flight-tracking:latest
    container_name: flight-tracking
    restart: unless-stopped
    ports:
      - "3000:80"
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # HTTP router (redirect to HTTPS)
      - "traefik.http.routers.flight-tracking-web.entrypoints=web"
      - "traefik.http.routers.flight-tracking-web.rule=Host(`flights.example.com`)"
      - "traefik.http.middlewares.flight-tracking-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.flight-tracking-web.middlewares=flight-tracking-redirect"

      # HTTPS router
      - "traefik.http.routers.flight-tracking-websecure.entrypoints=websecure"
      - "traefik.http.routers.flight-tracking-websecure.rule=Host(`flights.example.com`)"
      - "traefik.http.routers.flight-tracking-websecure.tls=true"
      - "traefik.http.routers.flight-tracking-websecure.tls.certResolver=letsencrypt"

      # Service configuration
      - "traefik.http.services.flight-tracking-websecure.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
