services:
  flight-tracking:
    image: ghcr.io/turentoo/flight-tracking:latest
    container_name: flight-tracking
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Supabase Configuration (REQUIRED)
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      # API Endpoints (optional)
      - VITE_ADSB_FI_API_URL=${VITE_ADSB_FI_API_URL:-https://opendata.adsb.fi/api}
      - VITE_FLIGHTAWARE_API_URL=${VITE_FLIGHTAWARE_API_URL:-https://aeroapi.flightaware.com/aeroapi}
      # Polling Configuration (optional)
      - VITE_POLLING_INTERVAL=${VITE_POLLING_INTERVAL:-30000}
      - VITE_ACTIVE_POLLING_INTERVAL=${VITE_ACTIVE_POLLING_INTERVAL:-20000}
      # Flight Detection (optional)
      - VITE_ALTITUDE_THRESHOLD=${VITE_ALTITUDE_THRESHOLD:-1300}
      # Operating Hours (optional)
      - VITE_ACTIVE_HOURS_START=${VITE_ACTIVE_HOURS_START:-9}
      - VITE_ACTIVE_HOURS_END=${VITE_ACTIVE_HOURS_END:-19}
      # Default Monitoring Boundary - Radlett, UK (optional)
      - VITE_DEFAULT_BOUNDARY_LAT_MIN=${VITE_DEFAULT_BOUNDARY_LAT_MIN:-51.666476}
      - VITE_DEFAULT_BOUNDARY_LAT_MAX=${VITE_DEFAULT_BOUNDARY_LAT_MAX:-51.692979}
      - VITE_DEFAULT_BOUNDARY_LON_MIN=${VITE_DEFAULT_BOUNDARY_LON_MIN:--0.351682}
      - VITE_DEFAULT_BOUNDARY_LON_MAX=${VITE_DEFAULT_BOUNDARY_LON_MAX:--0.277525}
    # Uncomment and configure the labels below if using Traefik reverse proxy:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.flight-tracking-web.entrypoints=web"
    #   - "traefik.http.routers.flight-tracking-web.rule=Host(`flights.example.com`)"
    #   - "traefik.http.middlewares.flight-tracking-redirect.redirectscheme.scheme=https"
    #   - "traefik.http.routers.flight-tracking-web.middlewares=flight-tracking-redirect"
    #   - "traefik.http.routers.flight-tracking-websecure.entrypoints=websecure"
    #   - "traefik.http.routers.flight-tracking-websecure.rule=Host(`flights.example.com`)"
    #   - "traefik.http.routers.flight-tracking-websecure.tls=true"
    #   - "traefik.http.routers.flight-tracking-websecure.tls.certResolver=letsencrypt"
    #   - "traefik.http.services.flight-tracking-websecure.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
